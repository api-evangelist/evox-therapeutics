name: Evox Therapeutics
description: >-
  Evox Therapeutics is an Oxford, United Kingdom based biotechnology company developing genetic
  medicines that expand the reach of gene therapy into the brain to transform the treatment landscape
  for severe neurodegenerative diseases. Its proprietary ExoEdit platform combines the natural transport
  capabilities of exosomes with CRISPR-based gene editing to improve the delivery, potency, and safety
  of genetic treatments for central nervous system disorders such as Rett Syndrome. Evox is a venture
  backed life-sciences company (investors include GV) and was added to the API Evangelist network as a
  company profile; it publishes a corporate and scientific website but does not currently expose a public
  developer API, SDK, or documentation surface.
